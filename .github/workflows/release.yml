# .github/workflows/release.yml
name: Release Firmware

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.8
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build ESP32 Firmware
        run: platformio run -e esp32
      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Flashing Instructions
            To flash the firmware to your ESP32 device, use the following command:
            ```
            python3 -m esptool --chip esp32 write_flash 0x0 firmware-esp32.bin
            ```

            To open the serial monitor, use the following command:
            ```
            python3 -m esptool --chip esp32 --port /dev/ttyUSB0 --baud 115200
            ```
          draft: false
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: .pio/build/esp32/firmware.bin
          asset_name: firmware-esp32-${{ env.VERSION }}.bin
          asset_content_type: application/octet-stream
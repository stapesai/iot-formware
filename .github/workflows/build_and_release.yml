name: Build and Release Firmware

on:
  push:
    # branches:
    #     - main
    tags:
      - v*

jobs:
  build_and_release_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v2

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8

      - name: Install PlatformIO
        id: install-platformio
        run: python -m pip install platformio esptool

      # - name: Build Firmware for ESP8266
      #   id: build-firmware-esp8266
      #   run: platformio run -e nodemcu

      - name: Build Firmware for ESP32
        id: build-firmware-esp32
        run: platformio run -e esp32

      # - name: Merge Binaries for ESP32
      #   id: merge-binaries-esp32
        # run: |
        #   python3 -m esptool --chip esp32 merge_bin -o main.bin --flash_mode dio --flash_freq 40m --flash_size 4MB \
        #   0x1000 .pio/build/esp32/bootloader.bin \
        #   0x8000 .pio/build/esp32/partitions.bin \
        #   0x10000 .pio/build/esp32/firmware.bin

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Flashing Instructions
            To flash the firmware to your ESP32 device, use the following command:
            ```
            python3 -m esptool --chip esp32 write_flash 0x0 firmware-esp32.bin
            ```

            To open the serial monitor, use the following command:
            ```
            python3 -m esptool --chip esp32 --port /dev/ttyUSB0 --baud 115200
            ```
          draft: false
          prerelease: false

      # - name: Upload Firmware for ESP8266
      #   id: upload-firmware-esp8266
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     upload_url: ${{ steps.create_release.outputs.upload_url }}
      #     asset_path: .pio/build/nodemcu/firmware.bin
      #     asset_name: firmware-esp8266.bin
      #     asset_content_type: application/octet-stream

      - name: Upload Merged Firmware for ESP32
        id: upload-firmware-esp32
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          # asset_path: main.bin
          asset_path: .pio/build/esp32/firmware.bin
          asset_name: firmware-esp32.bin
          asset_content_type: application/octet-stream

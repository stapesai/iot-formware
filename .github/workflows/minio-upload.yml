# .github/workflows/minio-upload.yml
name: Upload to MinIO

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Asset
        uses: actions/download-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: firmware-esp32-${{ github.event.release.tag_name }}.bin
          path: ./
      - name: Install MinIO Client
        run: |
          curl -O https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/mc
      - name: Configure MinIO
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
        run: |
          mc alias set myminio $MINIO_ENDPOINT $MINIO_ACCESS_KEY $MINIO_SECRET_KEY
      - name: Upload to MinIO
        run: |
          mc cp firmware-esp32-${{ github.event.release.tag_name }}.bin myminio/${MINIO_BUCKET}/
        #   mc cp firmware-esp32-${{ github.event.release.tag_name }}.bin myminio/${MINIO_BUCKET}/firmware-esp32-latest.bin